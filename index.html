<!doctype html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#08121a"><meta name="description" content="Jogo 3D de inspeção de farmácia e laboratório com WebXR e modo móvel estereoscópico."><title>Fiscal — Inspeção Farmacêutica</title></head>
<body><div id="app"><canvas id="world"></canvas>
<div id="hud" class="hidden"><div class="hud-top"><span>FISCAL <b id="levelLabel">NÍVEL 1</b></span><span>⏱ <b id="timer">10:00</b></span><span>★ <b id="score">0</b></span><span id="lives">♥ ♥ ♥</span></div><div class="hud-bottom"><span id="combo">COMBO ×1</span><span id="found">0 / 0 IRREGULARIDADES</span><span id="prompt">Centro: mirar · F: inspecionar</span></div><div id="reticle"><i></i></div><div id="gaze" class="hidden"><span></span></div></div>
<section id="menu" class="screen"><div class="menu-card"><div class="eyebrow">SIMULADOR DE INSPEÇÃO · 3D / VR</div><h1>Fiscal</h1><p class="lead">Observe com atenção. Nem toda irregularidade está à vista.</p><div class="menu-actions"><button id="start" class="primary">Iniciar inspeção</button><button id="tutorial">Como jogar</button><button id="settingsBtn">Configurações</button><button id="diagBtn">Diagnóstico do sistema</button></div><div class="menu-footer">Desktop · Mobile VR · WebXR <span id="best">RECORDE 0</span></div></div></section>
<section id="modal" class="screen hidden"><div class="modal-card"><button class="close" id="closeModal">×</button><div id="modalBody"></div></div></section>
<section id="inspect" class="inspect hidden"><div><small>EXAME DE CAMPO</small><h2 id="inspectTitle">Objeto</h2><p id="inspectDescription"></p><div id="inspectClues"></div><div class="inspect-actions"><button id="normalBtn">Parece normal</button><button id="irregularBtn" class="primary">Registrar irregularidade</button></div><button id="inspectBack" class="text-button">Voltar ao ambiente</button></div></section>
<div id="toast" class="toast hidden"></div><div id="debug" class="debug hidden"></div><div id="touchControls" class="touch-controls hidden"><button data-move="forward">▲</button><div><button data-move="left">◀</button><button data-move="back">▼</button><button data-move="right">▶</button></div></div>
</div><script type="module" src="/src/main.js"></script></body></html>
